name: Build

permissions:
  "contents": "write"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "Build ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["windows-latest", "macos-latest", "ubuntu-latest"]
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install dependencies
        run: dotnet restore
      - name: Build Release
        timeout-minutes: 30
        run: dotnet build -c Release --no-restore
      - name: Publish (Windows)
        if: startsWith(matrix.os, 'windows-')
        run: |
          dotnet publish -c Release -o NumberTools-${{ matrix.os }}.exe --no-restore
          mkdir release-artifacts
      - name: Publish (Ubuntu and Mac)
        if: startsWith(matrix.os, 'ubuntu-') || startsWith(matrix.os, 'macos-')
        run: |
          dotnet publish -c Release -o NumberTools-${{ matrix.os }} --no-restore
          mkdir release-artifacts
      - name: Compress
        run: |
          zip -rj release-artifacts/NumberTools-${{ matrix.os }}.zip bin/Release/net10.0/linux-x64/publish/*
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: NumberTools
          path: release-artifacts
  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # allows for tags access
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: NumberTools
          path: release-artifacts/
      - name: Create release
        uses: ncipollo/release-action@v1.20.0
        with:
          replacesArtifacts: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "release-artifacts/*"
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          name: Nightly Release
          tag: nightly-build
      - name: Update nightly-build tag
        run: |
          git tag -f nightly-build
          git push -f origin nightly-build
